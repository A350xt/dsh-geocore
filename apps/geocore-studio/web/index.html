<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoCore Studio</title>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-name">GeoCore Studio</span>
      <span class="brand-sub" id="model-badge"></span>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" id="tab-btn-map" data-tab="map" role="tab">🗺 地图工作台</button>
      <button class="tab" id="tab-btn-chat" data-tab="chat" role="tab">🤖 Agent 对话</button>
    </nav>
    <div class="top-actions">
      <button id="btn-back-dsh" class="back-dsn hidden" title="返回 DSH 对话界面">↩ 返回 DSH</button>
      <span id="bridge-status" class="status-dot" title="Python 内核状态">●</span>
    </div>
  </header>

  <main>
    <!-- ================= 标签页 A：地图工作台 ================= -->
    <section id="panel-map" class="panel active" role="tabpanel">
      <aside id="layer-panel">
        <div class="layer-panel-head">
          <span>图层</span>
          <button id="btn-refresh-inventory" class="icon-btn" title="刷新数据与产物清单">⟳</button>
        </div>
        <div class="basemap-row">
          <label>底图
            <select id="basemap-select">
              <option value="osm">OpenStreetMap</option>
              <option value="none">无底图</option>
            </select>
          </label>
        </div>
        <div id="layer-tree" class="layer-tree">
          <p class="tree-hint">清单加载中…</p>
        </div>
      </aside>

      <div id="map-wrap">
        <div id="ops-bar">
          <button class="op-btn" data-op="filter">筛选</button>
          <button class="op-btn" data-op="buffer">缓冲区</button>
          <button class="op-btn" data-op="within">邻近筛选</button>
          <button class="op-btn" data-op="overlay">叠加分析</button>
          <button class="op-btn" data-op="zonal">分区统计</button>
          <button class="op-btn" data-op="measure">度量</button>
        </div>
        <div id="map"></div>
      </div>

      <div id="result-panel" class="hidden">
        <div class="result-head">
          <strong id="result-title">分析结果</strong>
          <button id="result-close" class="icon-btn">✕</button>
        </div>
        <div id="result-body"></div>
      </div>
    </section>

    <!-- ================= 标签页 B：Agent 对话 ================= -->
    <section id="panel-chat" class="panel" role="tabpanel">
      <div id="chat-col">
        <div id="chat-messages">
          <div class="chat-welcome">
            <h3>GeoCore Agent</h3>
            <p>用自然语言提出空间问题，Agent 会组合 gis_inspect / gis_analyze / gis_visualize
              完成查询、缓冲、叠加、分区统计并制图；产物可一键加入「地图工作台」查看。</p>
            <ul class="chat-samples">
              <li><button class="sample">主干道 2 公里内、避开洪水区、面积大于 1 平方公里的地块有哪些？</button></li>
              <li><button class="sample">每个区有多少家医院、床位总数是多少？</button></li>
              <li><button class="sample">先 inspect 地块数据，再按用地类型做统计并出一张专题图</button></li>
            </ul>
          </div>
        </div>
        <div id="chat-input-row">
          <textarea id="chat-input" rows="2" placeholder="描述你的空间分析任务…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="chat-send" class="send-btn">发送</button>
        </div>
      </div>
    </section>
  </main>

  <div id="toast-root"></div>
  <div id="modal-root" class="hidden"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
