<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoCore Studio</title>
  <script>
    // 主题先行（避免闪白）：?theme=dark|light 显式指定，缺省跟随系统
    (function () {
      var t = new URLSearchParams(location.search).get('theme')
      if (t !== 'dark' && t !== 'light') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.dataset.theme = t
    })()
  </script>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-name">GeoCore Studio</span>
      <span class="brand-sub">地图工作台</span>
    </div>
    <div class="top-actions">
      <button id="btn-compose" class="ghost-pill" title="打开制图模式（版面编辑与导出）">🖨 制图</button>
      <button id="btn-back-dsh" class="ghost-pill hidden" title="返回 DSH 对话界面">↩ 返回 DSH</button>
      <span id="bridge-status" class="status-dot" title="Python 内核状态">●</span>
    </div>
  </header>

  <main>
    <section id="panel-map" role="tabpanel">
      <aside id="layer-panel">
        <div class="layer-panel-head">
          <span>图层</span>
          <button id="btn-refresh-inventory" class="icon-btn" title="刷新数据与产物清单">⟳</button>
        </div>
        <div class="basemap-row">
          <label>底图
            <select id="basemap-select">
              <option value="osm">OpenStreetMap</option>
              <option value="none">无底图</option>
            </select>
          </label>
        </div>
        <div id="layer-tree" class="layer-tree">
          <p class="tree-hint">清单加载中…</p>
        </div>
      </aside>

      <div id="map-wrap">
        <div id="ops-bar">
          <button class="op-btn" data-op="filter">筛选</button>
          <button class="op-btn" data-op="buffer">缓冲区</button>
          <button class="op-btn" data-op="within">邻近筛选</button>
          <button class="op-btn" data-op="overlay">叠加分析</button>
          <button class="op-btn" data-op="zonal">分区统计</button>
          <button class="op-btn" data-op="measure">度量</button>
        </div>
        <div id="map"></div>
      </div>

      <div id="result-panel" class="hidden">
        <div class="result-head">
          <strong id="result-title">分析结果</strong>
          <button id="result-close" class="icon-btn">✕</button>
        </div>
        <div id="result-body"></div>
      </div>
    </section>
  </main>

  <div id="toast-root"></div>
  <div id="modal-root" class="hidden"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
